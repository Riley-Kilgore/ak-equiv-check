name: equivalence-checker

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: false

      - uses: cda-tum/setup-z3@v1
        with:
          version: "4.15.4"

      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked

      - name: Build exact pinned Blaster dependencies
        working-directory: tool/blaster-backend
        run: lake build CardanoLedgerApi

      - name: Run Python unit and integration tests
        working-directory: tool
        run: uv run python -m unittest discover -s tests -v

      - name: Run real equivalent and non-equivalent Blaster smoke
        working-directory: tool
        run: uv run python -m unittest tests.test_real_blaster -v
