name: equivalence-checker

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Gate scope
        required: true
        default: first-wave
        type: choice
        options:
          - sentinel
          - first-wave
          - full-corpus
permissions:
  contents: read


jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Configure test imports
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/tool/tests" >> "$GITHUB_ENV"
      - name: Run unit, schema, and fake-tool tests
        working-directory: tool
        run: >-
          uv run python -m unittest -v
          tests.test_blaster
          tests.test_cli
          tests.test_corpus
          tests.test_gate
          tests.test_pairing
          tests.test_runner
          tests.test_semantics
          tests.test_blueprints
          tests.test_compiler_artifacts
          tests.test_profiles
          tests.test_evidence
          tests.test_candidate
          tests.test_baseline
      - name: Verify checked historical baseline identities
        working-directory: tool
        run: |
          for BASELINE in \
            ../results/baselines/historical-equivalent-v1.1.21-v1.1.22 \
            ../results/baselines/historical-regression-v1.1.22-v1.1.23
          do
            if [ "$(jq -r .schema_version "$BASELINE/checksums.json")" = 3 ]; then
              uv run equiv-checker baseline verify "$BASELINE"
            else
              echo "::notice::$BASELINE is explicitly legacy pending public-CI schema-version-3 publication"
            fi
          done

  evidence-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Run identity, tamper, protocol, cache, deduplication, and report tests
        working-directory: tool
        env:
          PYTHONPATH: tests
        run: >-
          uv run python -m unittest -v
          test_evidence
          test_blaster
          test_pairing
          test_runner
          test_baseline


  candidate-gate-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Test policy-neutral evidence and strict and screening decisions
        working-directory: tool
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest -v test_candidate

  candidate-bundle-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Test candidate bundle, cache, and implementation identities
        working-directory: tool
        env:
          PYTHONPATH: tests
        run: >-
          uv run python -m unittest -v
          test_candidate_bundle
          test_evidence_store
          test_checker_implementation

  baseline-v3-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Verify schema-version-3 historical baselines
        working-directory: tool
        run: |
          for BASELINE in \
            ../results/baselines/historical-equivalent-v1.1.21-v1.1.22 \
            ../results/baselines/historical-regression-v1.1.22-v1.1.23
          do
            if [ "$(jq -r .schema_version "$BASELINE/checksums.json")" = 3 ]; then
              uv run equiv-checker baseline verify "$BASELINE"
            else
              echo "::notice::$BASELINE is a legacy schema-version-2 baseline pending public-CI regeneration"
            fi
          done

  historical-equivalent:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.baseline-upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.baseline-upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Restore historical compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ak-equiv/compilers/*/bin/
            .ak-equiv/compilers/*/compiler.json
            .ak-equiv/compilers/*/logs/
          key: historical-equivalent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/compiler_profiles.lock.json', 'compiler-artifacts/*.json') }}
      - name: Install and verify pinned evaluator and Z3
        run: python3 scripts/setup_toolchains.py
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Build exact pinned Blaster dependencies
        working-directory: tool/blaster-backend
        run: lake build CardanoLedgerApi
      - name: Build or verify Aiken v1.1.21
        working-directory: tool
        run: uv run equiv-checker compiler build-release --ref v1.1.21 --output ../.ak-equiv/compilers/v1.1.21
      - name: Build or verify Aiken v1.1.22
        working-directory: tool
        run: uv run equiv-checker compiler build-release --ref v1.1.22 --output ../.ak-equiv/compilers/v1.1.22
      - name: Verify the immutable profile lock
        working-directory: tool
        run: uv run equiv-checker profile lock historical-equivalent-v1.1.21-v1.1.22
      - name: Run released positive profile with real Blaster
        working-directory: tool
        run: mkdir -p ../work && uv run equiv-checker profile run historical-equivalent-v1.1.21-v1.1.22 --resume | tee ../work/historical-equivalent-result.json
      - name: Capture unattested schema-version-3 positive baseline
        working-directory: tool
        run: |
          RUN_DIR="$(jq -er .underlying_summary.output ../work/historical-equivalent-result.json)"
          uv run python ../scripts/capture_historical_baseline.py \
            --profile historical-equivalent-v1.1.21-v1.1.22 \
            --run "$RUN_DIR" \
            --output ../work/ci-baselines/historical-equivalent-v1.1.21-v1.1.22
      - name: Upload compact positive baseline
        id: baseline-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: baseline-v3-positive-${{ github.run_id }}
          path: work/ci-baselines/historical-equivalent-v1.1.21-v1.1.22/
          if-no-files-found: error
      - name: Upload complete positive evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-equivalent-${{ github.run_id }}
          path: |
            .ak-equiv/compilers/v1.1.21/compiler.json
            .ak-equiv/compilers/v1.1.21/logs/
            .ak-equiv/compilers/v1.1.22/compiler.json
            .ak-equiv/compilers/v1.1.22/logs/
            work/runs/
          if-no-files-found: error

  historical-regression:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.baseline-upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.baseline-upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Restore historical compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ak-equiv/compilers/*/bin/
            .ak-equiv/compilers/*/compiler.json
            .ak-equiv/compilers/*/logs/
          key: historical-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/compiler_profiles.lock.json', 'compiler-artifacts/*.json') }}
      - name: Install and verify pinned evaluator and Z3
        run: python3 scripts/setup_toolchains.py
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Build exact pinned Blaster dependencies
        working-directory: tool/blaster-backend
        run: lake build CardanoLedgerApi
      - name: Build or verify Aiken v1.1.22
        working-directory: tool
        run: uv run equiv-checker compiler build-release --ref v1.1.22 --output ../.ak-equiv/compilers/v1.1.22
      - name: Build or verify Aiken v1.1.23
        working-directory: tool
        run: uv run equiv-checker compiler build-release --ref v1.1.23 --output ../.ak-equiv/compilers/v1.1.23
      - name: Verify the immutable profile lock
        working-directory: tool
        run: uv run equiv-checker profile lock historical-regression-v1.1.22-v1.1.23
      - name: Run released negative profile and independent replay
        working-directory: tool
        run: mkdir -p ../work && uv run equiv-checker profile run historical-regression-v1.1.22-v1.1.23 --resume | tee ../work/historical-regression-result.json
      - name: Capture unattested schema-version-3 negative baseline
        working-directory: tool
        run: |
          RUN_DIR="$(jq -er .underlying_summary.output ../work/historical-regression-result.json)"
          uv run python ../scripts/capture_historical_baseline.py \
            --profile historical-regression-v1.1.22-v1.1.23 \
            --run "$RUN_DIR" \
            --output ../work/ci-baselines/historical-regression-v1.1.22-v1.1.23
      - name: Upload compact negative baseline
        id: baseline-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: baseline-v3-negative-${{ github.run_id }}
          path: work/ci-baselines/historical-regression-v1.1.22-v1.1.23/
          if-no-files-found: error
      - name: Upload complete negative evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-regression-${{ github.run_id }}
          path: |
            .ak-equiv/compilers/v1.1.22/compiler.json
            .ak-equiv/compilers/v1.1.22/logs/
            .ak-equiv/compilers/v1.1.23/compiler.json
            .ak-equiv/compilers/v1.1.23/logs/
            work/runs/
          if-no-files-found: error

  baseline-v3-publication:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[baseline-v3]')
    needs:
      - historical-equivalent
      - historical-regression
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: baseline-v3-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Download positive compact baseline
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: baseline-v3-positive-${{ github.run_id }}
          path: incoming-positive
      - name: Download negative compact baseline
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: baseline-v3-negative-${{ github.run_id }}
          path: incoming-negative
      - name: Bind public CI attestations to baseline content
        env:
          GH_TOKEN: ${{ github.token }}
          POSITIVE_ARTIFACT_ID: ${{ needs.historical-equivalent.outputs.artifact-id }}
          POSITIVE_ARTIFACT_DIGEST: ${{ needs.historical-equivalent.outputs.artifact-digest }}
          NEGATIVE_ARTIFACT_ID: ${{ needs.historical-regression.outputs.artifact-id }}
          NEGATIVE_ARTIFACT_DIGEST: ${{ needs.historical-regression.outputs.artifact-digest }}
        run: |
          POSITIVE_RUN_ID="$(jq -er .run_id incoming-positive/summary.json)"
          NEGATIVE_RUN_ID="$(jq -er .run_id incoming-negative/summary.json)"
          POSITIVE_JOB_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "historical-equivalent") | .id')"
          NEGATIVE_JOB_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "historical-regression") | .id')"
          jq -n \
            --arg profile historical-equivalent-v1.1.21-v1.1.22 \
            --arg run "$POSITIVE_RUN_ID" \
            --arg head "$GITHUB_SHA" \
            --arg digest "sha256:${POSITIVE_ARTIFACT_DIGEST#sha256:}" \
            --argjson workflow "$GITHUB_RUN_ID" \
            --argjson job "$POSITIVE_JOB_ID" \
            --argjson artifact "$POSITIVE_ARTIFACT_ID" \
            '{profile_id:$profile,baseline_run_id:$run,workflow_revision:$head,platform:"ubuntu-24.04",workflow_run:{id:$workflow,head_sha:$head,conclusion:"success"},job:{id:$job,conclusion:"success"},artifact:{id:$artifact,digest:$digest}}' \
            > positive-ci-provenance.json
          jq -n \
            --arg profile historical-regression-v1.1.22-v1.1.23 \
            --arg run "$NEGATIVE_RUN_ID" \
            --arg head "$GITHUB_SHA" \
            --arg digest "sha256:${NEGATIVE_ARTIFACT_DIGEST#sha256:}" \
            --argjson workflow "$GITHUB_RUN_ID" \
            --argjson job "$NEGATIVE_JOB_ID" \
            --argjson artifact "$NEGATIVE_ARTIFACT_ID" \
            '{profile_id:$profile,baseline_run_id:$run,workflow_revision:$head,platform:"ubuntu-24.04",workflow_run:{id:$workflow,head_sha:$head,conclusion:"success"},job:{id:$job,conclusion:"success"},artifact:{id:$artifact,digest:$digest}}' \
            > negative-ci-provenance.json
          uv run --directory tool python ../scripts/capture_historical_baseline.py \
            --profile historical-equivalent-v1.1.21-v1.1.22 \
            --baseline ../incoming-positive \
            --ci-provenance ../positive-ci-provenance.json
          uv run --directory tool python ../scripts/capture_historical_baseline.py \
            --profile historical-regression-v1.1.22-v1.1.23 \
            --baseline ../incoming-negative \
            --ci-provenance ../negative-ci-provenance.json
          python3 -c 'import shutil; from pathlib import Path; pairs=(("incoming-positive","results/baselines/historical-equivalent-v1.1.21-v1.1.22"),("incoming-negative","results/baselines/historical-regression-v1.1.22-v1.1.23")); [(shutil.rmtree(dst, ignore_errors=True), shutil.copytree(src, dst)) for src, dst in pairs]'
          uv run --directory tool equiv-checker baseline verify ../results/baselines/historical-equivalent-v1.1.21-v1.1.22
          uv run --directory tool equiv-checker baseline verify ../results/baselines/historical-regression-v1.1.22-v1.1.23
      - name: Publish attested schema-version-3 baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/baselines/historical-equivalent-v1.1.21-v1.1.22 results/baselines/historical-regression-v1.1.22-v1.1.23
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish schema v3 historical baselines [baseline-v3]"
          git push origin HEAD:main

  candidate-gate-changed-output:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Install and verify pinned evaluator and Z3
        run: python3 scripts/setup_toolchains.py
      - name: Create clean Aiken release and candidate worktrees
        run: |
          git clone --filter=blob:none https://github.com/aiken-lang/aiken.git "$RUNNER_TEMP/aiken"
          git -C "$RUNNER_TEMP/aiken" worktree add --detach "$RUNNER_TEMP/aiken-v1.1.21" 42babe5d5fcdd403ed58ed924fdc2aed331ede4d
          git -C "$RUNNER_TEMP/aiken" worktree add --detach "$RUNNER_TEMP/aiken-v1.1.22" 39d6b049da08816aa51c9f8d3d73b9d292922f45
          git -C "$RUNNER_TEMP/aiken" worktree add --detach "$RUNNER_TEMP/aiken-v1.1.23" 8949565a9969278846ffefe30bc3b892029dd318
      - name: Build changed-output release and local candidate interfaces
        working-directory: tool
        run: |
          uv run equiv-checker compiler build-release --aiken-source "$RUNNER_TEMP/aiken-v1.1.21" --ref v1.1.21 --label base-changed --output ../.ak-equiv/compilers/base-changed
          uv run equiv-checker compiler build-local --aiken-source "$RUNNER_TEMP/aiken-v1.1.22" --label candidate-changed --output ../.ak-equiv/compilers/candidate-changed
      - name: Run changed output through global candidate planning
        working-directory: tool
        run: |
          set -o pipefail
          rm -rf ../work/historical-candidate-sentinel
          cp -a ../fixtures/historical-codegen-equivalent ../work/historical-candidate-sentinel
          mkdir -p ../work/historical-candidate-sentinel/coverage
          printf '%s\n' '{"schema_version":1,"features":[],"builtins":[]}' > ../work/historical-candidate-sentinel/coverage/feature-manifest.json
          printf '%s\n' '{"schema_version":1,"features":[],"active_uplc_builtins":[]}' > ../work/historical-empty-feature-contract.json
          uv run equiv-checker candidate gate \
            --base-compiler-manifest ../.ak-equiv/compilers/base-changed/compiler.json \
            --candidate-compiler-manifest ../.ak-equiv/compilers/candidate-changed/compiler.json \
            --feature-contract ../work/historical-empty-feature-contract.json \
            --corpus-lock ../corpus/aiken_mandatory_corpus.lock.json \
            --scope sentinel \
            --sentinel-package ../work/historical-candidate-sentinel \
            --resume \
            --policy strict \
            --jobs 1 | tee ../work/historical-candidate-gate-result.json
          BUNDLE="$(jq -er .output ../work/historical-candidate-gate-result.json)"
          uv run equiv-checker candidate verify "$BUNDLE"
          test "$(jq -r .strict_decision ../work/historical-candidate-gate-result.json)" = pass
          test "$(jq -r '.counts.changed_program_pairs > 0' ../work/historical-candidate-gate-result.json)" = true
          test "$(jq -r '.counts.raw_complete_changed_pairs == .counts.changed_program_pairs' ../work/historical-candidate-gate-result.json)" = true
      - name: Build and run the current same-source smoke
        working-directory: tool
        run: |
          uv run equiv-checker compiler build-release --aiken-source "$RUNNER_TEMP/aiken-v1.1.23" --ref v1.1.23 --label base-current --output ../.ak-equiv/compilers/base-current
          uv run equiv-checker compiler build-local --aiken-source "$RUNNER_TEMP/aiken-v1.1.23" --label candidate-current --output ../.ak-equiv/compilers/candidate-current
          uv run equiv-checker profile run local-candidate --old-compiler-manifest ../.ak-equiv/compilers/base-current/compiler.json --new-compiler-manifest ../.ak-equiv/compilers/candidate-current/compiler.json --resume --strict
      - name: Upload local candidate provenance and semantic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-candidate-changed-output-${{ github.run_id }}
          path: |
            .ak-equiv/compilers/base-changed/compiler.json
            .ak-equiv/compilers/base-changed/logs/
            .ak-equiv/compilers/candidate-changed/compiler.json
            .ak-equiv/compilers/candidate-changed/logs/
            .ak-equiv/compilers/base-current/compiler.json
            .ak-equiv/compilers/base-current/logs/
            .ak-equiv/compilers/candidate-current/compiler.json
            .ak-equiv/compilers/candidate-current/logs/
            work/runs/
            work/candidate-gates/
            work/historical-candidate-gate-result.json
          if-no-files-found: error
  candidate-gate-full:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Install Python and pinned semantic toolchains
        run: |
          uv sync --directory tool --locked
          python3 scripts/setup_toolchains.py
          (cd tool/blaster-backend && lake build CardanoLedgerApi)
      - name: Materialize clean Aiken v1.1.23 source
        run: |
          git clone --filter=blob:none https://github.com/aiken-lang/aiken.git "$RUNNER_TEMP/aiken"
          git -C "$RUNNER_TEMP/aiken" worktree add --detach "$RUNNER_TEMP/aiken-v1.1.23" 8949565a9969278846ffefe30bc3b892029dd318
      - name: Build release base and local candidate artifacts
        working-directory: tool
        run: |
          uv run equiv-checker compiler build-release \
            --aiken-source "$RUNNER_TEMP/aiken-v1.1.23" \
            --ref v1.1.23 \
            --label base \
            --output ../.ak-equiv/compilers/base
          uv run equiv-checker compiler build-local \
            --aiken-source "$RUNNER_TEMP/aiken-v1.1.23" \
            --label candidate \
            --output ../.ak-equiv/compilers/candidate
      - name: Run and verify the complete strict candidate gate
        run: |
          mkdir -p work
          set -o pipefail
          uv run --directory tool equiv-checker candidate gate \
            --base-compiler-manifest ../.ak-equiv/compilers/base/compiler.json \
            --candidate-compiler-manifest ../.ak-equiv/compilers/candidate/compiler.json \
            --feature-contract ../corpus/aiken_language_features_v1_1_23.json \
            --corpus-lock ../corpus/aiken_mandatory_corpus.lock.json \
            --scope sentinel,mandatory \
            --resume \
            --policy strict \
            --jobs 4 | tee work/candidate-gate-result.json
          BUNDLE="$(jq -er .output work/candidate-gate-result.json)"
          uv run --directory tool equiv-checker candidate verify "$BUNDLE"
          cp -a "$BUNDLE" work/candidate-bundle
          tar -czf work/candidate-bundle.tar.gz -C work/candidate-bundle .
      - name: Attest the candidate evidence archive
        id: candidate-attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: work/candidate-bundle.tar.gz
      - name: Verify signed candidate evidence and release decision
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.candidate-attestation.outputs.bundle-path }}
        run: |
          set -o pipefail
          cp "$ATTESTATION_BUNDLE" work/candidate-attestation.json
          uv run --directory tool equiv-checker candidate verify \
            work/candidate-bundle.tar.gz \
            --repository "$GITHUB_REPOSITORY" \
            --attestation-bundle work/candidate-attestation.json \
            | tee work/candidate-release-verification.json
          test "$(jq -r .publishable work/candidate-release-verification.json)" = true
      - name: Upload verified candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-gate-full-${{ github.run_id }}
          path: |
            work/candidate-gate-result.json
            work/candidate-release-verification.json
            work/candidate-bundle/
            work/candidate-attestation.json
            work/candidate-bundle.tar.gz
            .ak-equiv/compilers/base/compiler.json
            .ak-equiv/compilers/candidate/compiler.json
          if-no-files-found: error




  real-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Install and verify pinned Aiken and Z3 binaries
        run: python3 scripts/setup_toolchains.py
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Build exact pinned Blaster dependencies
        working-directory: tool/blaster-backend
        run: lake build CardanoLedgerApi
      - name: Run distinct-compiler and real-Blaster smoke tests once
        working-directory: tool
        run: uv run python -m unittest -v tests.test_real_aiken tests.test_real_blaster

  manual-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: real-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          use-github-cache: true
          use-mathlib-cache: false
          lake-package-directory: tool/blaster-backend
          build: true
          build-args: CardanoLedgerApi
          test: false
          lint: false
      - name: Install and verify pinned Aiken and Z3 binaries
        run: python3 scripts/setup_toolchains.py
      - name: Install Python dependencies
        working-directory: tool
        run: uv sync --locked
      - name: Build exact pinned Blaster dependencies
        working-directory: tool/blaster-backend
        run: lake build CardanoLedgerApi
      - name: Validate the mandatory execution plan
        working-directory: tool
        run: uv run equiv-checker corpus plan ../corpus/aiken_mandatory_corpus.lock.json
      - name: Run the strict feature sentinel
        working-directory: tool
        run: >-
          uv run equiv-checker sentinel
          --old-aiken ../bin/aiken-v1.1.22
          --new-aiken ../bin/aiken-v1.1.23
          --feature-contract ../corpus/aiken_language_features_v1_1_23.json
          --resume
          --strict | tee ../work/sentinel-summary.json
      - name: Run first-wave public semantic sources
        if: inputs.scope == 'first-wave'
        working-directory: tool
        run: >-
          uv run equiv-checker corpus run ../corpus/aiken_mandatory_corpus.lock.json
          --old-aiken ../bin/aiken-v1.1.22
          --new-aiken ../bin/aiken-v1.1.23
          --only AIKEN_SAMPLE
          --only AIKEN_STDLIB
          --only EDU_CONTROL
          --only EDU_CUSTOM_TYPES
          --only EDU_FUNCTIONS
          --only EDU_MINTING
          --only EDU_PRIMITIVES
          --only EDU_SPENDING
          --only EDU_STAKING
          --jobs 8
          --resume
      - name: Run the complete mandatory corpus
        if: inputs.scope == 'full-corpus'
        working-directory: tool
        run: >-
          uv run equiv-checker corpus run ../corpus/aiken_mandatory_corpus.lock.json
          --old-aiken ../bin/aiken-v1.1.22
          --new-aiken ../bin/aiken-v1.1.23
          --jobs 8
          --resume | tee ../work/corpus-summary.json
      - name: Capture the compact baseline
        if: inputs.scope == 'full-corpus'
        working-directory: tool
        run: >-
          uv run python ../scripts/capture_baseline.py
          --sentinel-run "$(jq -r .output ../work/sentinel-summary.json)"
          --corpus-run "$(jq -r .output ../work/corpus-summary.json)"
      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: equivalence-${{ inputs.scope }}-${{ github.run_id }}
          path: |
            work/runs/
            work/corpus-runs/
            results/baselines/aiken-v1.1.22-v1.1.23/
          if-no-files-found: error
