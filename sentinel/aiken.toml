name = "equiv/sentinel"
version = "0.0.0"
compiler = "v1.1.23"
plutus = "v3"
license = "Apache-2.0"
description = "Aiken contracts for project 'equiv/sentinel'"

[repository]
user = "equiv"
project = "sentinel"
platform = "github"

[[dependencies]]
name = "aiken-lang/stdlib"
version = "v3.1.0"
source = "github"

[config.default]
price = 1000000
is_mainnet = true
network = "mainnet"
network_utf8 = { bytes = "preview", encoding = "utf8" }
