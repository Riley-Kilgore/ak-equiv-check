asset = ["HOSKY", 42]

[config.preview]
price = 500000
is_mainnet = false
network = "preview"
network_utf8 = { bytes = "preview", encoding = "utf8" }
policy_hex = { bytes = "deadbeef", encoding = "hex" }
quotas = [3, 2, 1]
asset = ["HOSKY", 42]
