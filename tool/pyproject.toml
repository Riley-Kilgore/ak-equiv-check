[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiken-equiv-checker"
version = "0.1.0"
description = "Evidence scanner for paired Aiken compiler builds"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
equiv-checker = "equiv_checker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["equiv_checker"]
